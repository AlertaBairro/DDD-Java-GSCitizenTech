spring.application.name=alertabairro-api

# Porta definida pelo Render (variavel PORT); 8080 localmente
server.port=${PORT:8080}
# O Render termina o HTTPS no proxy: respeita X-Forwarded-* nos redirects (Swagger)
server.forward-headers-strategy=framework

# Respostas JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=always
server.error.include-message=always

# CORS: origens do front separadas por virgula (variavel CORS_ORIGINS no Render)
app.cors.origens=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
